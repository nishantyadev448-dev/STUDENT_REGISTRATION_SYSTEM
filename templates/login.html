<!DOCTYPE html>

<html>

<head>

<title>Admin Login</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="container">


<h1>Admin Login</h1>


<form method="POST" action="/login">


<label>Username</label>

<input 
type="text" 
name="username" 
placeholder="Enter username"
required>


<label>Password</label>

<input 
type="password" 
name="password"
placeholder="Enter password"
required>


<br><br>


<button type="submit">
Login
</button>


</form>


</div>


</body>

</html>
